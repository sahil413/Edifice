name: Refresh Kansas sites

on:
  schedule:
    - cron: "0 10 * * *"   # 06:00 EDT (05:00 EST in winter)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Workload Identity Federation (keyless Google auth for the Firestore push)

concurrency:
  group: refresh-sites
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITES_PASSWORD: ${{ secrets.SITES_PASSWORD }}
      PASSWORD_ENV: SITES_PASSWORD
      PIPELINE_URL: ${{ secrets.PIPELINE_URL }}
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
      # Firebase app (see firebase/README.md). Web config is public project metadata -> repo variable.
      FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
      SITES_MODE: ${{ vars.SITES_MODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          pip install -r pipeline/requirements.txt
          npm install -g staticrypt@3
          # pdftotext for PDF ordinances/agendas; non-fatal (PDF citations are then marked "not re-verified")
          command -v pdftotext || { sudo apt-get update -q && sudo apt-get install -y -q poppler-utils; } || echo "poppler-utils unavailable"

      - name: Check secret
        run: test -n "$SITES_PASSWORD" || { echo "SITES_PASSWORD repo secret is missing"; exit 1; }

      # Public GIS layers only (no contacts/listing data) — lets a flaky Overpass fall back to the last good pull.
      - name: Restore public geodata cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/geocache
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-

      - name: Decrypt private inputs into runner temp
        run: |
          python3 pipeline/crypt.py dec pipeline/contacts.enc "$RUNNER_TEMP/contacts.json"
          if [ -f pipeline/state.enc ]; then python3 pipeline/crypt.py dec pipeline/state.enc "$RUNNER_TEMP/state.json"; fi
          python3 pipeline/crypt.py dec pipeline/issues.enc "$RUNNER_TEMP/issues.json"
          python3 pipeline/crypt.py dec pipeline/local_review.enc "$RUNNER_TEMP/local_review.json"
          if [ -f pipeline/storage_state.enc ]; then python3 pipeline/crypt.py dec pipeline/storage_state.enc "$RUNNER_TEMP/storage_state.json"; fi
          python3 pipeline/crypt.py dec pipeline/tracker_review.enc "$RUNNER_TEMP/tracker_review.json"
          if [ -f pipeline/tracker_state.enc ]; then python3 pipeline/crypt.py dec pipeline/tracker_state.enc "$RUNNER_TEMP/tracker_state.json"; fi

      - name: Scrape
        run: |
          python3 pipeline/scrape.py \
            --out-dir "$RUNNER_TEMP/data" \
            --geo-cache-dir "$RUNNER_TEMP/geocache" \
            --contacts "$RUNNER_TEMP/contacts.json" \
            --state "$RUNNER_TEMP/state.json"

      # Community score (laws & zoning 45%, local news 30%, EDC 25%) + annexation status.
      # News queries are cached 6 days (--news-max-age-h 144); EDC site crawls and law-citation
      # checks are cached 7 days under geocache/community/local_review, so they refresh weekly.
      # TIGER boundaries and hand-verified items (issues.enc, local_review.enc) apply every day.
      - name: Community (laws, news, EDC) + annexation
        run: |
          python3 -W ignore pipeline/community.py \
            --data "$RUNNER_TEMP/data/sites.json" \
            --cache-dir "$RUNNER_TEMP/geocache/community" \
            --curated "$RUNNER_TEMP/issues.json" \
            --state "$RUNNER_TEMP/state.json" \
            --local-review "$RUNNER_TEMP/local_review.json" \
            --news-max-age-h 144

      # Local-government stance: every Kansas entry on the More Than Just Parks Data Center Tracker,
      # read at its original source (hand review in tracker_review.enc) -> Laws & zoning adjustment,
      # plus outreach plans. New/stale detail pages are refetched (<=15 per run); if the tracker is
      # unreachable the last good pull (tracker_state.enc) is used. Failure leaves community scores as-is.
      - name: Tracker stance + outreach plans
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 pipeline/tracker.py \
            --data "$RUNNER_TEMP/data/sites.json" \
            --review "$RUNNER_TEMP/tracker_review.json" \
            --state "$RUNNER_TEMP/tracker_state.json"

      # Self-storage view (6 largest KS cities): Crexi + LOIS listings, city zoning GIS, KDOT AADT,
      # OSM competition, Census demand. Area-wide public layers are cached in geocache/storage;
      # per-listing lookups go to an uncached temp dir and listings live only in encrypted
      # storage_state.enc. If the live listing pull fails, retry reusing the last good pull (<72 h).
      - name: Storage (land 4-12 ac + facilities for sale)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          run() { python3 -W ignore pipeline/storage.py \
            --out "$RUNNER_TEMP/data/storage.json" \
            --state "$RUNNER_TEMP/storage_state.json" \
            --cache-dir "$RUNNER_TEMP/geocache/storage" \
            --point-cache-dir "$RUNNER_TEMP/stpoint"; }
          run || STORAGE_REUSE_STATE_H=72 run

      # Site data, roster-gated, lives in Firestore; nothing about the sites is in the public page.
      # Keyless: GitHub's OIDC token is exchanged for a short-lived token of the pipeline service account.
      # Repo variables: GCP_WIF_PROVIDER (projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>)
      # and GCP_SERVICE_ACCOUNT (<name>@<project>.iam.gserviceaccount.com).
      - name: Google auth (Workload Identity Federation)
        if: ${{ env.FIREBASE_WEB_CONFIG != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Push to Firestore
        if: ${{ env.FIREBASE_WEB_CONFIG != '' }}
        env:
          FIREBASE_PROJECT: ${{ fromJSON(vars.FIREBASE_WEB_CONFIG || '{"projectId":""}').projectId }}
        run: |
          pip install -q firebase-admin
          python3 pipeline/edks.py push --data "$RUNNER_TEMP/data/sites.json" --storage "$RUNNER_TEMP/data/storage.json" --password-env SITES_PASSWORD

      # Manually added sites are kept by the push; re-score them daily against today's geodata/community.
      - name: Re-enrich manual sites
        if: ${{ env.FIREBASE_WEB_CONFIG != '' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          FIREBASE_PROJECT: ${{ fromJSON(vars.FIREBASE_WEB_CONFIG || '{"projectId":""}').projectId }}
        run: |
          python3 -W ignore pipeline/edks.py enrich --all \
            --cache-dir "$RUNNER_TEMP/geocache" --geo-cache-dir "$RUNNER_TEMP/geocache" \
            --contacts "$RUNNER_TEMP/contacts.json" --curated "$RUNNER_TEMP/issues.json" \
            --local-review "$RUNNER_TEMP/local_review.json" --state "$RUNNER_TEMP/state.json" \
            --tracker-review "$RUNNER_TEMP/tracker_review.json" --tracker-state "$RUNNER_TEMP/tracker_state.json"

      # Counts only (no emails or site data in the public log): admins seeded, sites present, live rules == file.
      - name: Verify Firestore
        if: ${{ env.FIREBASE_WEB_CONFIG != '' }}
        env:
          FIREBASE_PROJECT: ${{ fromJSON(vars.FIREBASE_WEB_CONFIG || '{"projectId":""}').projectId }}
        run: python3 pipeline/edks.py verify --min-admins 3 --rules firebase/firestore.rules

      - name: Unit tests (synthetic data only)
        run: python3 -m unittest discover -s pipeline/tests

      # Bounded learned weights (learnings/weights); prints counts only.
      - name: Recompute learned weights
        if: ${{ env.FIREBASE_WEB_CONFIG != '' }}
        env:
          FIREBASE_PROJECT: ${{ fromJSON(vars.FIREBASE_WEB_CONFIG || '{"projectId":""}').projectId }}
        run: python3 -W ignore pipeline/edks.py learn

      # SITES_MODE=firebase: sites/index.html is the Google sign-in app (no site data; render.py fails the
      # build if any data, contact or email address appears in it) and sites/app/ redirects to /sites/.
      # Otherwise the StaticCrypt page stays live and the sign-in app is staged at sites/app/.
      - name: Render
        # Mapbox token injection is paused: GitHub push protection blocks the rendered page that embeds it.
        # Re-enable with: env: MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }} once the token is allowed.
        run: |
          R="python3 pipeline/render.py --data $RUNNER_TEMP/data/sites.json --storage $RUNNER_TEMP/data/storage.json --password-env SITES_PASSWORD"
          if [ "$SITES_MODE" = "firebase" ]; then
            $R --mode firebase --out-dir sites
            mkdir -p sites/app
            printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Edifice</title><meta name="robots" content="noindex">' \
              '<link rel="canonical" href="/sites/"><meta http-equiv="refresh" content="0; url=/sites/">' \
              '<script>location.replace("/sites/"+location.search+location.hash)</script><a href="/sites/">Continue</a>' > sites/app/index.html
            if grep -q staticrypt sites/index.html; then echo "cutover page still encrypted" >&2; exit 1; fi
          else
            $R --out-dir sites
            if [ -n "$FIREBASE_WEB_CONFIG" ]; then $R --mode firebase --out-dir sites/app; fi
          fi

      - name: Re-encrypt state
        run: |
          python3 pipeline/crypt.py enc "$RUNNER_TEMP/state.json" pipeline/state.enc
          if [ -f "$RUNNER_TEMP/storage_state.json" ]; then python3 pipeline/crypt.py enc "$RUNNER_TEMP/storage_state.json" pipeline/storage_state.enc; fi
          if [ -f "$RUNNER_TEMP/tracker_state.json" ]; then python3 pipeline/crypt.py enc "$RUNNER_TEMP/tracker_state.json" pipeline/tracker_state.enc; fi

      - name: Commit encrypted output only
        run: |
          git config user.name "edifice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/index.html pipeline/state.enc
          if [ -f sites/app/index.html ]; then git add sites/app/index.html; fi
          if [ -f pipeline/storage_state.enc ]; then git add pipeline/storage_state.enc; fi
          if [ -f pipeline/tracker_state.enc ]; then git add pipeline/tracker_state.enc; fi
          git reset -q -- 'gha-creds-*.json' 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Kansas sites $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Scrub plaintext
        if: always()
        run: rm -rf gha-creds-*.json "$RUNNER_TEMP/data" "$RUNNER_TEMP/contacts.json" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/issues.json" "$RUNNER_TEMP/local_review.json" "$RUNNER_TEMP/storage_state.json" "$RUNNER_TEMP/stpoint" "$RUNNER_TEMP/tracker_review.json" "$RUNNER_TEMP/tracker_state.json"
