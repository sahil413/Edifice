name: Refresh Kansas sites

on:
  schedule:
    - cron: "0 10 * * *"   # 06:00 EDT (05:00 EST in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sites
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITES_PASSWORD: ${{ secrets.SITES_PASSWORD }}
      PASSWORD_ENV: SITES_PASSWORD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          pip install -r pipeline/requirements.txt
          npm install -g staticrypt@3
          # pdftotext for PDF ordinances/agendas; non-fatal (PDF citations are then marked "not re-verified")
          command -v pdftotext || { sudo apt-get update -q && sudo apt-get install -y -q poppler-utils; } || echo "poppler-utils unavailable"

      - name: Check secret
        run: test -n "$SITES_PASSWORD" || { echo "SITES_PASSWORD repo secret is missing"; exit 1; }

      # Public GIS layers only (no contacts/listing data) — lets a flaky Overpass fall back to the last good pull.
      - name: Restore public geodata cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/geocache
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-

      - name: Decrypt private inputs into runner temp
        run: |
          python3 pipeline/crypt.py dec pipeline/contacts.enc "$RUNNER_TEMP/contacts.json"
          if [ -f pipeline/state.enc ]; then python3 pipeline/crypt.py dec pipeline/state.enc "$RUNNER_TEMP/state.json"; fi
          python3 pipeline/crypt.py dec pipeline/issues.enc "$RUNNER_TEMP/issues.json"
          python3 pipeline/crypt.py dec pipeline/local_review.enc "$RUNNER_TEMP/local_review.json"
          if [ -f pipeline/storage_state.enc ]; then python3 pipeline/crypt.py dec pipeline/storage_state.enc "$RUNNER_TEMP/storage_state.json"; fi

      - name: Scrape
        run: |
          python3 pipeline/scrape.py \
            --out-dir "$RUNNER_TEMP/data" \
            --geo-cache-dir "$RUNNER_TEMP/geocache" \
            --contacts "$RUNNER_TEMP/contacts.json" \
            --state "$RUNNER_TEMP/state.json"

      # Community score (laws & zoning 45%, local news 30%, EDC 25%) + annexation status.
      # News queries are cached 6 days (--news-max-age-h 144); EDC site crawls and law-citation
      # checks are cached 7 days under geocache/community/local_review, so they refresh weekly.
      # TIGER boundaries and hand-verified items (issues.enc, local_review.enc) apply every day.
      - name: Community (laws, news, EDC) + annexation
        run: |
          python3 -W ignore pipeline/community.py \
            --data "$RUNNER_TEMP/data/sites.json" \
            --cache-dir "$RUNNER_TEMP/geocache/community" \
            --curated "$RUNNER_TEMP/issues.json" \
            --state "$RUNNER_TEMP/state.json" \
            --local-review "$RUNNER_TEMP/local_review.json" \
            --news-max-age-h 144

      # Self-storage view (6 largest KS cities): Crexi + LOIS listings, city zoning GIS, KDOT AADT,
      # OSM competition, Census demand. Area-wide public layers are cached in geocache/storage;
      # per-listing lookups go to an uncached temp dir and listings live only in encrypted
      # storage_state.enc. If the live listing pull fails, retry reusing the last good pull (<72 h).
      - name: Storage (land 4-12 ac + facilities for sale)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          run() { python3 -W ignore pipeline/storage.py \
            --out "$RUNNER_TEMP/data/storage.json" \
            --state "$RUNNER_TEMP/storage_state.json" \
            --cache-dir "$RUNNER_TEMP/geocache/storage" \
            --point-cache-dir "$RUNNER_TEMP/stpoint"; }
          run || STORAGE_REUSE_STATE_H=72 run

      - name: Render + encrypt (StaticCrypt)
        run: python3 pipeline/render.py --data "$RUNNER_TEMP/data/sites.json" --storage "$RUNNER_TEMP/data/storage.json" --out-dir sites --password-env SITES_PASSWORD

      - name: Re-encrypt state
        run: |
          python3 pipeline/crypt.py enc "$RUNNER_TEMP/state.json" pipeline/state.enc
          if [ -f "$RUNNER_TEMP/storage_state.json" ]; then python3 pipeline/crypt.py enc "$RUNNER_TEMP/storage_state.json" pipeline/storage_state.enc; fi

      - name: Commit encrypted output only
        run: |
          git config user.name "edifice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/index.html pipeline/state.enc
          if [ -f pipeline/storage_state.enc ]; then git add pipeline/storage_state.enc; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Kansas sites $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Scrub plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/contacts.json" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/issues.json" "$RUNNER_TEMP/local_review.json" "$RUNNER_TEMP/storage_state.json" "$RUNNER_TEMP/stpoint"
