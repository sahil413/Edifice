<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edifice</title>
<meta name="description" content="Edifice — We found and fund AI-powered assets. Kansas.">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:title" content="Edifice">
<meta property="og:description" content="We found and fund AI-powered assets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 48'%3E%3Cpath d='M19 1 L31 13 L31 22 L19 34 L19 27 L27 19 L27 16 L19 8 Z' fill='none' stroke='%23F14B21' stroke-width='3'/%3E%3Cpath d='M14 13 L14 20 L6 28 L6 31 L14 39 L14 46 L2 34 L2 25 Z' fill='none' stroke='%23F14B21' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #0A0A0A; }
  body {
    color: #FFFFFF;
    font-family: 'Jost', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #FFFFFF; text-decoration: none; }
  a:hover, a:focus-visible { color: #F14B21; }

  .page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background-color: #0A0A0A;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 72px 72px;
    background-position: -1px -1px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  header {
    padding: 32px 48px;
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: flex-end; gap: 6px; }
  .logo svg { flex: none; margin-bottom: 3px; }
  .wordmark { font-size: 28px; font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
  .locations { font-size: 12px; letter-spacing: 0.14em; color: #9A9A9A; }

  main {
    flex: 1 1 auto;
    padding: 64px 48px;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
  }
  .eyebrow { font-size: 13px; letter-spacing: 0.14em; color: #F14B21; }
  h1 {
    margin: 0; max-width: 1180px;
    font-weight: 300;
    font-size: clamp(48px, 7.6vw, 120px);
    line-height: 1.02; letter-spacing: -0.03em;
  }
  h1 strong { font-weight: 500; }
  .cursor {
    display: inline-block; width: 0.08em; height: 0.82em;
    margin-left: 0.08em; background: #F14B21; vertical-align: -0.06em;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  footer {
    padding: 28px 48px 32px;
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex; flex-wrap: wrap; gap: 12px 40px;
    align-items: center; justify-content: space-between;
    font-size: 13px; letter-spacing: 0.08em; color: #9A9A9A;
  }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 24px; padding-right: 24px; }
    header { padding-top: 24px; padding-bottom: 24px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">
      <svg width="24" height="36" viewBox="0 0 32 48" fill="none" aria-hidden="true">
        <path d="M19 1 L31 13 L31 22 L19 34 L19 27 L27 19 L27 16 L19 8 Z" stroke="#F14B21" stroke-width="2.5"/>
        <path d="M14 13 L14 20 L6 28 L6 31 L14 39 L14 46 L2 34 L2 25 Z" stroke="#F14B21" stroke-width="2.5"/>
      </svg>
      <span class="wordmark">edifice</span>
    </div>
    <span class="mono locations">KANSAS</span>
  </header>

  <main>
    <span class="mono eyebrow">/ EDIFICE</span>
    <h1>We found and fund <strong>AI‑powered</strong> assets.<span class="cursor" aria-hidden="true"></span></h1>
  </main>

  <footer class="mono">
    <span>CONTACT → <a href="mailto:investors@edifice.vc">investors@edifice.vc</a></span>
    <span>© 2026 EDIFICE</span>
  </footer>
</div>
</body>
</html>
